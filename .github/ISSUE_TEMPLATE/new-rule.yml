name: New rule
description: Suggest an insecure pattern the guard should catch.
labels: [rule-request]
body:
  - type: dropdown
    id: kind
    attributes:
      label: File type
      options: [GitHub Actions, Dockerfile, Terraform, Kubernetes, Secrets (any file), Cloud CLI command, Other]
    validations:
      required: true
  - type: textarea
    id: insecure
    attributes:
      label: Insecure example (should be flagged)
      render: text
    validations:
      required: true
  - type: textarea
    id: safe
    attributes:
      label: Safe example (must not be flagged)
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it dangerous? Links to advisories or docs welcome.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Suggested severity
      description: high and critical block Claude's write by default.
      options: [low, medium, high, critical]
