name: False positive
description: The guard flagged code that is safe.
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: GHA001
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: The flagged code
      description: A minimal snippet that triggers the rule. Remove secrets and internal names.
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it safe?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Shift-Left Guard version
      placeholder: 0.1.0
